
name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  sonar-analysis:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build

      - name: Check and run tests with coverage
        shell: bash
        run: |
          if find src -type f -name '*.spec.ts' -print -quit | grep -q .; then
            echo "Pruebas encontradas. Ejecutando..."
            npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
          else
            echo "::warning::No se encontraron pruebas unitarias (*.spec.ts)."
            echo "Se continua sin reporte de cobertura."
          fi

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
